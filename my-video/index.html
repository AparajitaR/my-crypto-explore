<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #07080b; }
      #root { width: 100%; height: 100%; }
      #ground { position: absolute; inset: 0; background: #07080b; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="90" data-width="1080" data-height="1920">
      <div id="ground"></div>
      <div id="intro" data-composition-id="intro" data-composition-src="compositions/intro.html" data-start="0.0000" data-duration="6.0000" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="morning" data-composition-id="morning" data-composition-src="compositions/morning.html" data-start="6.0000" data-duration="10.8000" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="golden" data-composition-id="golden" data-composition-src="compositions/golden.html" data-start="16.8000" data-duration="7.2000" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="sunset" data-composition-id="sunset" data-composition-src="compositions/sunset.html" data-start="24.0000" data-duration="9.4000" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="manikaran" data-composition-id="manikaran" data-composition-src="compositions/manikaran.html" data-start="33.4000" data-duration="23.6000" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="afternoons" data-composition-id="afternoons" data-composition-src="compositions/afternoons.html" data-start="57.0000" data-duration="6.6000" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="night" data-composition-id="night" data-composition-src="compositions/night.html" data-start="63.6000" data-duration="10.4000" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="oneyear" data-composition-id="oneyear" data-composition-src="compositions/oneyear.html" data-start="74.0000" data-duration="8.5000" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="outro" data-composition-id="outro" data-composition-src="compositions/outro.html" data-start="82.5000" data-duration="7.5000" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
